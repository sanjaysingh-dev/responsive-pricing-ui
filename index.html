<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Component</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
  </head>

  <body>
    <!--Heading-->
    <h1 id="heading">Our Pricing</h1>

    <!--Toggle-->
    <input type="checkbox" id="toggle" />

    <div id="toggleContainer">
      <span>Annually</span>
      <label id="outer" for="toggle">
        <div id="inner"></div>
      </label>
      <span>Monthly</span>
    </div>

    <!--Plans-->

    <div id="container">
      <!--Basic-->

      <div class="plan" id="basic">
        <div>Basic</div>
        <div class="price" id="price1">
          <span class="annual">$199.99</span>
          <span class="monthly">$19.99</span>
        </div>
        <hr />
        <div>500 GB Storage</div>
        <hr />
        <div>2 Users Allowed</div>
        <hr />
        <div>Send up to 3 GB</div>
        <hr />
        <button class="learnMore">Learn More</button>
      </div>

      <!--Professional-->

      <div class="plan" id="professional">
        <div>Professional</div>
        <div class="price" id="price2">
          <span class="annual">$249.99</span>
          <span class="monthly">$24.99</span>
        </div>
        <hr />
        <div>1 TB Storage</div>
        <hr />
        <div>5 Users Allowed</div>
        <hr />
        <div>Send up to 10 GB</div>
        <hr />
        <button class="learnMore" id="btn2">Learn More</button>
      </div>

      <!--Master-->

      <div class="plan" id="master">
        <div>Master</div>
        <div class="price" id="price3">
          <span class="annual">$399.99</span>
          <span class="monthly">$39.99</span>
        </div>
        <hr />
        <div>2 TB Storage</div>
        <hr />
        <div>10 Users Allowed</div>
        <hr />
        <div>Send up to 20 GB</div>
        <hr />
        <button class="learnMore">Learn More</button>
      </div>
    </div>
  </body>
</html>
